[workspace]
resolver = "3"
members = [
    "crates/identifiers",
    "crates/event-envelope",
    "crates/error-contracts",
    "crates/operation-contracts",
    "crates/document-contracts",
    "crates/social-contracts",
    "tools/contractsc",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"                 # equals the pinned toolchain; no MSRV promise we cannot check
license      = "BSD-3-Clause"
repository   = "https://github.com/po4yka/ratatoskr-contracts"

[workspace.dependencies]
# ---- in-repo ----
ratatoskr-identifiers         = { version = "0.1.0", path = "crates/identifiers" }
ratatoskr-event-envelope      = { version = "0.1.0", path = "crates/event-envelope" }
ratatoskr-error-contracts     = { version = "0.1.0", path = "crates/error-contracts" }
ratatoskr-operation-contracts = { version = "0.1.0", path = "crates/operation-contracts" }
ratatoskr-document-contracts  = { version = "0.1.0", path = "crates/document-contracts" }
ratatoskr-social-contracts    = { version = "0.1.0", path = "crates/social-contracts" }

# ---- shape the generated bytes: EXACT pins (§6.6 rule 11) ----
schemars   = { version = "=1.2.2", features = ["uuid1", "jiff02"] }
serde_json = "=1.0.151"               # preserve_order MUST NOT be enabled anywhere (§6.6 rule 3)

# ---- do not shape the generated bytes: caret + committed lockfile ----
serde     = { version = "1.0.229", features = ["derive"] }
uuid      = { version = "1.24.1", features = ["std", "serde", "v7"] }
jiff      = { version = "0.2.35", features = ["std", "serde"] }
regex     = { version = "1.13.1", default-features = false, features = ["std"] }
thiserror = "2.0.20"

# ---- generator only ----
clap   = { version = "4.6.6", features = ["derive"] }
toml   = "1.1.4"
sha2   = "0.11.0"
hex    = "0.4.3"
anyhow = "1.0.104"

# ---- dev only ----
proptest   = "1.11.0"
jsonschema = "0.49.9"

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "deny"     # rustdoc becomes JSON Schema `description`
missing_debug_implementations = "deny"
unreachable_pub               = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
float_arithmetic   = "deny"
# `panic`, `unwrap_used` and `expect_used` above close every EXPLICIT panic path and leave the most
# common implicit one open. Both of these are `allow` by default and live in `clippy::restriction`, so
# `pedantic` does not enable them.
indexing_slicing   = "deny"     # `v[i]` and `&s[a..b]` panicking out of bounds
string_slice       = "deny"     # `&s[..n]` panicking because n is not a UTF-8 char boundary
