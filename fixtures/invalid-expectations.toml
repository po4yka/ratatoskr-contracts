# social/social-source-snapshot
# ---------------------------------------------------------------------------

["social/social-source-snapshot/invalid/unknown-acquisition-method.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `carrier_pigeon`'
reason         = "AcquisitionMethod is closed: how a source entered the library decides retention and provenance handling, and an unrecognized method must stop processing instead of being filed under a default. DOMAIN invariant 6, 'rejected explicitly'."

["social/social-source-snapshot/invalid/unknown-saved-authority.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `platform_says_so`'
reason         = "SavedAuthority is closed. Misreading authority is exactly the Instagram-phantom-bookmark failure mode AGENTS.md forbids; a consumer that guesses treats a maybe-saved source as saved."

["social/social-source-snapshot/invalid/partial-without-warning.json"]
rejected_by    = ["serde"]
error_contains = 'completeness `partial` requires at least one warning'
reason         = "Invariant S1. A partial capture that explains nothing leaves the consumer unable to act on the gap. Cross-field, so JSON Schema draft 2020-12 cannot express it; only the Rust type rejects it."

["social/social-source-snapshot/invalid/captured-at-trailing-zeros.json"]
rejected_by    = ["serde"]
error_contains = 'not in canonical form'
reason         = "`...:00.000Z` renders as `...:00Z`, so it is a second spelling of one instant. Canonicality is a Rust-layer rule the published `pattern` permits; see ADR-0001 consequences and the event-envelope fixture of the same shape."

["social/social-source-snapshot/invalid/missing-social-source-id.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'missing field `social_source_id`'
reason         = "Without Ratatoskr's own identity there is nothing to deduplicate against or update later; the provider id alone is not stable across platform changes."

["social/social-source-snapshot/invalid/unknown-upstream-availability.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `shadowbanned`'
reason         = "UpstreamAvailability is closed because availability drives conservative retention decisions. An unrecognized state must stop processing rather than be read as available."

["social/social-source-snapshot/invalid/media-missing-blob.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'missing field `blob`'
reason         = "A media item without its BlobRef names bytes nobody can resolve or verify; media travels strictly by reference in this contract."

# ---------------------------------------------------------------------------
# events/social.source.captured.v1
# ---------------------------------------------------------------------------

["events/social.source.captured.v1/invalid/missing-source.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'missing field `source`'
reason         = "The payload is state-carried transfer: without the snapshot the event announces a capture of nothing and cannot be indexed idempotently."

# ---------------------------------------------------------------------------
# events/social.source.updated.v1
# ---------------------------------------------------------------------------

["events/social.source.updated.v1/invalid/source-missing-owner.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'missing field `owner`'
reason         = "Every snapshot of a source carries the same owner; an update that cannot say whose library changed is unroutable for tenancy-scoped consumers."

# ---------------------------------------------------------------------------
# ai_archive/archive-snapshot
# ---------------------------------------------------------------------------

["ai_archive/archive-snapshot/invalid/unknown-completeness-state.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant'
reason         = "ARCHITECTURE S8.3 fixes the completeness vocabulary; an unrecognized state must stop processing instead of being read as whole-enough, because indexing depth and re-import scheduling hang off it."

["ai_archive/archive-snapshot/invalid/partial-without-gap.json"]
rejected_by    = ["serde"]
error_contains = "requires at least one gap"
reason         = "Invariant A1: every completeness state other than complete must name at least one gap. Cross-field, so JSON Schema cannot express it and the schema layer accepts this payload - the lower-bound rule of ADR-0001."

["ai_archive/archive-snapshot/invalid/conversation-count-mismatch.json"]
rejected_by    = ["serde"]
error_contains = 'conversation_count 5 does not match the 1'
reason         = "Invariant A2: a report's conversation count must equal the conversations the payload carries, so a producer cannot report evidence its own snapshot disproves."

["ai_archive/archive-snapshot/invalid/imported-at-trailing-zeros.json"]
rejected_by    = ["serde"]
error_contains = 'not in canonical form'
reason         = "`...:00.000Z` renders as `...:00Z`, so it is a second spelling of one instant. Canonicality is a Rust-layer rule; JSON Schema cannot express it, and the published pattern permits the fraction. See ADR-0001 consequences."

["ai_archive/conversation/invalid/provider-uppercase-token.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'does not match ^[a-z][a-z0-9_]{0,31}$'
reason         = "The provider vocabulary is open but its token grammar is not: segments are snake_case, matching every event-type segment and the social Platform precedent. One spelling per provider name."

["ai_archive/conversation/invalid/missing-owner.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = "missing field `owner`"
reason         = "Tenancy governs authorization and data separation (SECURITY.md); a conversation whose owner is unknown must stop processing rather than default to any tenant."

["ai_archive/message/invalid/malformed-known-part.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'expected only `text`'
reason         = "A recognized part_kind claims grammar this build owns, so a wrong member is a malformed record that fails loudly - it is never demoted to the unknown-preservation channel, which is reserved for unrecognized records."

["ai_archive/message/invalid/uppercase-author-role.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant'
reason         = "Author roles are a closed four-value vocabulary; role drives attribution, and silently filing an unrecognized role under a default would misattribute statements."

["ai_archive/project/invalid/provider-created-at-trailing-zeros.json"]
rejected_by    = ["serde"]
error_contains = 'not in canonical form'
reason         = "One spelling per instant on the whole wire: `.000` adds no information and renders away, so only the canonical form parses. Serde-layer rule; the pattern permits the fraction."

["events/ai_archive.archive.imported.v1/invalid/missing-completeness-report.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = "missing field `completeness_report`"
reason         = "The imported event is the evidence claim: identity, owner, timing and completeness travel together, because a consumer cannot decide how to index an import whose wholeness is unknown."

["ai_archive/archive-snapshot/invalid/gap-count-mismatch.json"]
rejected_by    = ["serde"]
error_contains = 'gap_count'
reason         = "Invariant A3: the declared gap count must equal the gaps carried."

["events/ai_archive.conversation.added.v1/invalid/missing-conversation.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = "missing field `conversation`"
reason         = "State-carried transfer is the replay-safety stance: an added event without the whole conversation would be an unactionable announcement, so the member is required."

["events/ai_archive.conversation.updated.v1/invalid/missing-ai-archive-id.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = "missing field `ai_archive_id`"
reason         = "The owning import ties a conversation to its evidence and completeness report; without it a consumer cannot trace the record back to the export it was parsed from."

# ---------------------------------------------------------------------------
# backup/desired-backup-policy
# ---------------------------------------------------------------------------

["backup/desired-backup-policy/invalid/policy-version-zero.json"]
rejected_by    = ["serde"]
error_contains = 'policy_version must be greater than zero'
reason         = "Versions are monotonic and start above zero: a zeroth version has no place in the succession and would leave the first comparison undefined. The bound lives in the Rust type alone, so JSON Schema accepts what it cannot express - the ADR-0001 lower-bound rule."

["backup/desired-backup-policy/invalid/duplicate-repository-entry.json"]
rejected_by    = ["serde"]
error_contains = 'in more than one entry'
reason         = "Two entries naming one repository contradict the document about what that repository's depth is, and no draft 2020-12 keyword expresses uniqueness across array members - so only the Rust type rejects it."

["backup/desired-backup-policy/invalid/unknown-mirror-cadence.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `hourly`'
reason         = "MirrorCadence is closed: cadence decides backup frequency, and an unrecognized class read as some default silently changes what gets preserved when. DOMAIN invariant 6, 'rejected explicitly'."

["backup/desired-backup-policy/invalid/unknown-priority-hint.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `urgent`'
reason         = "BackupPriorityHint is closed: ordering drives scheduling under contention, so a guessed hint reorders backups without anyone deciding to. DOMAIN invariant 6, 'rejected explicitly'."

["backup/desired-backup-policy/invalid/produced-at-trailing-zeros.json"]
rejected_by    = ["serde"]
error_contains = 'not in canonical form'
reason         = "`...:00.000Z` renders as `...:00Z`, so it is a second spelling of one instant. Canonicality is inherited from WireTimestamp and is a Rust-layer rule; the published pattern permits the fraction. See ADR-0001 consequences."

["backup/desired-backup-policy/invalid/exclusion-expression-control-character.json"]
rejected_by    = ["serde"]
error_contains = 'contains a control character'
reason         = "Control bytes corrupt logs, terminals and line-oriented tooling downstream, so the carrier bans C0 and DEL outright; draft 2020-12 cannot ban a character class without freezing the whole alphabet into one pattern, so the Rust type owns the rule."

# ---------------------------------------------------------------------------
# events/vault.backup_policy.acknowledged.v1
# ---------------------------------------------------------------------------

["events/vault.backup_policy.acknowledged.v1/invalid/accepted-with-reasons.json"]
rejected_by    = ["serde"]
error_contains = 'outcome `accepted` forbids rejection reasons'
reason         = "Acceptance means every entry was applied; attaching refusal explanations to it tells consumers to prune state they just confirmed. Cross-field, so only the Rust type rejects it."

["events/vault.backup_policy.acknowledged.v1/invalid/rejected-without-reasons.json"]
rejected_by    = ["serde"]
error_contains = 'outcome `rejected` requires at least one reason'
reason         = "AGENTS principle 7: errors are machine-actionable. A rejection that explains nothing leaves GitHub unable either to fix or to escalate; cross-field, so the schema layer accepts what the type refuses."

["events/vault.backup_policy.acknowledged.v1/invalid/reason-reference-without-matching-code.json"]
rejected_by    = ["serde"]
error_contains = 'carries a repository reference it must not'
reason         = "Only `repository_unknown_in_catalog` concerns one repository; a reference on any other code points reconciliation machinery at a target its code never named."

["events/vault.backup_policy.acknowledged.v1/invalid/repository-reason-missing-reference.json"]
rejected_by    = ["serde"]
error_contains = 'rejection reason with code `repository_unknown_in_catalog` requires a repository reference'
reason         = "The unknown-entry report exists so the catalog gap can be closed; without the reference the reason names nothing and cannot be acted on."

["events/vault.backup_policy.acknowledged.v1/invalid/acknowledged-version-zero.json"]
rejected_by    = ["serde"]
error_contains = 'must be greater than zero'
reason         = "No published policy carries version zero, so no acknowledgment can answer one; the floor is a Rust-layer rule the schema cannot express."

["events/vault.backup_policy.acknowledged.v1/invalid/accepted-with-applied-ahead.json"]
rejected_by    = ["serde"]
error_contains = 'at or below'
reason         = "Accepting a version at or below the last applied one is indistinguishable from a replayed acknowledgment; acceptance must imply forward progress."

["events/vault.backup_policy.acknowledged.v1/invalid/unknown-reason-code.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `catalog_on_fire`'
reason         = "PolicyRejectionCode is closed: GitHub branches on the code to fix and republish, and an unrecognized code filed under any default would route the response to the wrong repair. DOMAIN invariant 6, 'rejected explicitly'."

# ---------------------------------------------------------------------------
# events/platform.notification.raised.v1
# ---------------------------------------------------------------------------

["events/platform.notification.raised.v1/invalid/class-token-uppercase.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'does not match ^[a-z][a-z0-9_-]{0,31}$'
reason         = "Notification-class tokens are snake_case, matching every reference kind and event-name segment; case variance would let one class travel under several spellings and split its routing. An unrecognized token is preserved only when it is well formed - uppercase input is a typo or hostile, not future vocabulary."

["events/platform.notification.raised.v1/invalid/registry-version-zero.json"]
rejected_by    = ["serde"]
error_contains = 'class_registry_version must be greater than zero'
reason         = "Taxonomy registry versions start at 1: a producer that declared version 0 would make 'speaks no vocabulary' representable silence, and consumers could not tell preservation from recognition. The floor lives in the Rust type alone, so the schema layer accepts what it cannot express - the ADR-0001 lower-bound rule."

["events/platform.notification.raised.v1/invalid/unknown-priority-hint.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `urgent`'
reason         = "NotificationPriority is closed, mirroring BackupPriorityHint: a guessed priority silently reorders delivery, so an unrecognized level must stop processing rather than be read as some default. DOMAIN invariant 6, 'rejected explicitly'."

["events/platform.notification.raised.v1/invalid/quiet-hours-offset-out-of-range.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'at most 86399 seconds'
reason         = "Each quiet-hours offset names a second inside one UTC day; 86400 names no second of any day, so both the published maximum and the Rust type refuse it. The equality ban between the two bounds is narrower still and lives in the Rust type alone."
