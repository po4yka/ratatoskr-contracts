reason         = "The uploaded bytes of a property value are one JSON value; notes parses them as JSON and refuses any other media type."

["commands/notes.file.write_requested.v1/invalid/inline-content.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'expected struct BlobRef'
reason         = "Write content is uploaded first and named by a BlobRef; note text in the command would enter Edge's outbox and JetStream."

# ---------------------------------------------------------------------------
# notes.conflict.raised.v1 and notes.conflict.resolved.v1 (OBS-024, contract notes/conflict.v1)
#
# Both refuse unknown fields, so an unknown-field fixture is rejected by both layers. The merge
# proposal rules are in the schema too: the root of notes.conflict.raised.v1 is a oneOf of three
# closed shapes, so a schema-only consumer refuses the same fixtures as the Rust type.
# ---------------------------------------------------------------------------

["events/notes.conflict.raised.v1/invalid/attachment-with-proposal.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'merge_proposal is allowed only for text/markdown and text/plain, found `image/png`'
reason         = "Notes merges text by lines only; a proposal for a binary file would offer accept_merge for bytes that no merge produced. The schema refuses it too: its oneOf allows merge_proposal only in the shape whose media_type is text/markdown or text/plain."

["events/notes.conflict.raised.v1/invalid/proposal-without-base.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'merge_proposal requires base_hash, current_hash and writer_hash'
reason         = "A three-way merge reads the base, the current revision and the writer's content; a proposal without one of them names a merge that cannot exist."

["events/notes.conflict.raised.v1/invalid/unknown-field.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown field `text`'
reason         = "A conflict carries hashes, never the file text; a member outside the schema is refused so vault content cannot ride along."

["events/notes.conflict.resolved.v1/invalid/unknown-field.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown field `text`'
reason         = "A resolution carries the resulting revision hash, never the file text; a member outside the schema is refused so vault content cannot ride along."

