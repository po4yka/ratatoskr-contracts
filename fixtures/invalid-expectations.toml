error_contains = 'unknown variant'
reason         = "DocumentBlock major 1 is a closed two-variant set: readers reject a kind discriminant they do not know at both layers instead of preserving it. ADR-0010's procedure rests on this loud-rejection stance - a producer cannot emit a new kind ahead of consumer adoption, so every kind proposal must land in this repository first."

