reason         = "A frontmatter value is note content; it is uploaded first and named by a BlobRef, so no byte of a note enters Edge's outbox or JetStream. serde reads the inline array as the BlobRef members in order, so its error names the second member's type."

["commands/notes.file.write_requested.v1/invalid/property-value-not-json.json"]
