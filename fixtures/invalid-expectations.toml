# fixtures/invalid-expectations.toml
#
# Every file under any `invalid/` directory has an entry here, keyed by its path relative to
# `fixtures/`. An "invalid" fixture with no declared reason is untestable: it might be failing
# because of a typo.
#
# `rejected_by` makes ADR-0001's "the schema is a lower bound" consequence auditable per fixture.
# The test asserts BOTH directions: the fixture is rejected by every layer listed, and ACCEPTED
# by every layer not listed. A fixture that is invalid by accident fails the build.
#
#   json_schema — rejected by the generated draft 2020-12 schema
#   serde       — rejected by the canonical Rust type's `Deserialize`
#
# `error_contains` is a substring of the rejecting layer's error text. TOML literal strings
# (single quotes) are used throughout so a published `pattern` can be quoted verbatim.

# ---------------------------------------------------------------------------
# channel-digest commands and recap facts
# ---------------------------------------------------------------------------

["commands/channel_digest.subscription.set_requested.v1/invalid/mixed-case-channel.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'channel username is not canonical'
reason         = "Channel usernames are signed and hashed in their canonical lowercase spelling; mixed case is never silently normalized."

["commands/channel_digest.run.requested.v1/invalid/trigger-window-mismatch.json"]
rejected_by    = ["serde"]
error_contains = 'digest run trigger instant must equal the window end'
reason         = "Platform trigger authority and the closed-open source window must identify one exact occurrence; schema cannot express the cross-field instant equality."

["commands/channel_digest.schedule.occurrence_requested.v1/invalid/reversed-grid.json"]
rejected_by    = ["serde"]
error_contains = 'digest window must have an exclusive end after its start'
reason         = "A deployment occurrence must move forward from the previous UTC grid point; schema cannot compare the two instants."

["commands/knowledge.channel_digest_recap.requested.v1/invalid/channels-exceed-sources.json"]
rejected_by    = ["serde"]
error_contains = 'digest channel count cannot exceed source count'
reason         = "A manifest cannot represent more distinct channels than selected immutable source revisions; schema cannot compare the two bounded counters."

["events/knowledge.channel_digest_recap.completed.v1/invalid/inconsistent-coverage.json"]
rejected_by    = ["serde"]
error_contains = 'digest coverage counts are inconsistent'
reason         = "Included plus omitted source counts must equal selected coverage so a terminal fact never fabricates completeness."

["events/knowledge.channel_digest_recap.failed.v1/invalid/unknown-failure-code.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'unknown variant `provider_dump`'
reason         = "Failures carry a closed content-free operational class; arbitrary provider diagnostics cannot become a published reason."

