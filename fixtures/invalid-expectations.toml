["content/document/invalid/duplicate-block-id.json"]
rejected_by    = ["serde"]
error_contains = 'duplicate block identifier'
reason         = "Block identifiers are unique within one immutable Document IR revision; JSON Schema cannot express the cross-array uniqueness invariant."

["content/document/invalid/missing-provenance.json"]
rejected_by    = ["json_schema", "serde"]
error_contains = 'missing field `provenance`'
reason         = "Knowledge must be able to trace normalized blocks to the stored source and extraction strategy."

["content/document/invalid/unknown-kind.json"]
