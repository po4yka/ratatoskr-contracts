[[contract]]
id             = "platform.operation_snapshot"
family         = "platform"
major_version  = 1
lifecycle      = "proposed"
classification = "public"
owner          = "ratatoskr-platform"
producers      = ["ratatoskr-platform"]
consumers      = ["ratatoskr-platform"]
crate_name     = "ratatoskr-operation-contracts"
canonical_path = "crates/operation-contracts/src/snapshot.rs"
fixtures_dir   = "fixtures/platform/operation-snapshot"
summary        = "Point-in-time public view of a long-running operation."

[[contract.root_type]]
rust_path      = "ratatoskr_operation_contracts::OperationSnapshot"
output         = "schemas/json-schema/platform/operation-snapshot.v1.schema.json"
schema_id      = "urn:ratatoskr:contracts:platform:v1:OperationSnapshot"
unknown_policy = "preserve"
privacy        = "boundary_metadata"

[[contract.field]]
pointer     = "/properties/accepted_at"
authority   = "observed"
nullability = "required"
unit        = "instant_rfc3339_utc_canonical"
note        = "Instant the accepting component durably recorded the request. Platform-observed, not client-asserted."

[[contract.field]]
pointer     = "/properties/status_changed_at"
authority   = "observed"
nullability = "required"
unit        = "instant_rfc3339_utc_canonical"
note        = "Instant `status` last changed. Equal to accepted_at for the first snapshot; never earlier."

[[contract.field]]
pointer     = "/properties/terminated_at"
authority   = "observed"
nullability = "omitted_when_absent"
unit        = "instant_rfc3339_utc_canonical"
note        = "Instant the operation first reached a terminal status. Present exactly when status is terminal."

[[contract.vague_field_waiver]]
pointer       = "/properties/status"
justification = "Name fixed by ARCHITECTURE S5.4, which enumerates the seven permitted values. Closed enum with documented terminality; the contract is precise despite the generic name."

