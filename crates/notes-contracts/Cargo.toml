[package]
name        = "ratatoskr-notes-contracts"
description = "Vault connection, file change and conflict events of ratatoskr-notes, and the write command it consumes, for connected Obsidian vaults."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
ratatoskr-identifiers.workspace = true
# Needed for `impl EventPayload` and `impl CommandPayload` on the payloads; the orphan rule leaves
# this crate as the only legal home for those impls.
ratatoskr-event-envelope.workspace = true
serde.workspace      = true
schemars.workspace   = true
regex.workspace      = true
thiserror.workspace  = true

[dev-dependencies]
serde_json.workspace = true
# The write and conflict tests check each fixture against the generated schema too.
jsonschema.workspace = true

[lints]
workspace = true
